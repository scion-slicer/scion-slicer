name: Release

# Push a vX.Y.Z tag (see scripts/release.mjs). Builds the server for every platform in
# npm/platforms.json, publishes the platform packages and then the launcher to npm, and
# creates the GitHub release from the CHANGELOG section.
#
# Publishing uses npm trusted publishing once it is set up for each package. npm only
# allows that on a package that already exists, so the first release uses NPM_TOKEN, a
# short-lived token stored in the "npm" environment. When trusted publishing is set up,
# delete that secret: with no token, npm publishes through trusted publishing.

on:
  push:
    tags: ['v*.*.*']
  # Run by hand for a dry run: builds every platform and runs `npm publish --dry-run`,
  # without publishing anything or creating a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.json }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check versions (against the tag, when there is one)
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            node scripts/release.mjs --check "$GITHUB_REF_NAME"
          else
            node scripts/release.mjs --check
          fi
      - id: platforms
        run: echo "json=$(node -e 'process.stdout.write(JSON.stringify(require("./npm/platforms.json")))')" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.versions.outputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: ./scripts/bootstrap.sh
      - run: rustup target add ${{ matrix.platform.target }}
      - run: cargo build --profile dist -p scion-slicer-mcp --target ${{ matrix.platform.target }}
      - name: Package
        run: |
          exe=target/${{ matrix.platform.target }}/dist/scion-slicer-mcp
          [[ "${{ matrix.platform.os }}" == win32 ]] && exe="$exe.exe"
          node scripts/npm-platform.mjs ${{ matrix.platform.npm }} "$exe" "dist/${{ matrix.platform.npm }}"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform.npm }}
          path: dist/${{ matrix.platform.npm }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: npm-*
      - name: Publish the platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Trusted publishing adds provenance on its own; a token needs this.
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          for dir in dist/npm-*/; do
            chmod +x "$dir"bin/* || true
            ./scripts/npm-publish-once.sh "$dir"
          done
      - name: Publish the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          cp LICENSE npm/mcp/LICENSE
          ./scripts/npm-publish-once.sh npm/mcp
      - name: GitHub release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Scion Slicer $version" --notes-file notes.md
