name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/release.mjs --check

  build:
    # Builds and tests on every platform we ship npm packages for, so a platform that
    # breaks shows up here before a release does.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The engine patches must apply byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: ./scripts/bootstrap.sh
      - run: cargo test --release
      - run: cargo build --release -p scion-slicer-mcp
      # Packs this platform's npm package and the launcher, installs them the way npm
      # would for a user, and runs MCP sessions through the same npx command the plugin
      # uses: check_print on a test part, the update note and about, and the opt-out.
      - name: MCP session through an npm install
        run: |
          T=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          key=$(node -p 'process.platform + "-" + process.arch')
          version=$(node -p 'require("./npm/mcp/package.json").version')
          exe=target/release/scion-slicer-mcp
          [[ "$RUNNER_OS" == Windows ]] && exe="$exe.exe"
          node scripts/npm-platform.mjs "$key" "$exe" "$T/pkg/$key"
          cp LICENSE npm/mcp/LICENSE
          mkdir -p "$T/tgz" "$T/app"
          npm pack "$T/pkg/$key" ./npm/mcp --pack-destination "$T/tgz" --silent
          rm npm/mcp/LICENSE
          root=$PWD
          cd "$T/app"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$T"/tgz/*.tgz
          node "$root/scripts/test-mcp.mjs" npx -y "@scion-slicer/mcp@$version"
