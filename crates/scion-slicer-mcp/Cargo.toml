[package]
name = "scion-slicer-mcp"
description = "MCP server for Scion Slicer: lets an AI agent run resin print checks on a mesh."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scion-slicer-mcp"
path = "src/main.rs"

[dependencies]
scion-slicer-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
