[workspace]
resolver = "2"
members = ["crates/scion-slicer-core", "crates/scion-slicer-mcp"]
# DragonFruit's crates are path dependencies, not members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/scion-slicer/scion-slicer"

[workspace.dependencies]
dragonfruit-slicing-engine = { path = "vendor/DragonFruit/rust/dragonfruit-slicing-engine" }
dragonfruit-islands = { path = "vendor/DragonFruit/rust/dragonfruit-islands" }
scion-slicer-core = { path = "crates/scion-slicer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

[profile.release]
debug = 1

# What the npm packages ship: no debug info, stripped, one codegen unit.
[profile.dist]
inherits = "release"
debug = 0
strip = true
lto = "thin"
codegen-units = 1
